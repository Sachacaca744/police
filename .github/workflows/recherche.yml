name: Build recherche
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1
      - name: Compile
        working-directory: recherche-mod
        run: gradle build --no-daemon
      - name: Zip the jar
        working-directory: recherche-mod
        run: cd build/libs && zip recherche-mod.zip recherche-1.0.0.jar
      - uses: actions/upload-artifact@v4
        with:
          name: recherche-mod
          path: recherche-mod/build/libs/recherche-mod.zip
